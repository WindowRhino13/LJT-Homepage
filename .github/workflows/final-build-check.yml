name: Final Build Check

on:
  workflow_dispatch:

jobs:
  build-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Assert all six publications appear on Home and Publications pages
        run: |
          test -f _site/index.html
          test -f _site/publications/index.html
          for t in SynLogic "Perception Bottleneck" "Universal Truthfulness" "In-Context Sharpness" "C-Eval" "Composing Parameter-Efficient"; do
            grep -q "$t" _site/index.html
            grep -q "$t" _site/publications/index.html
          done
          echo "All publications present on both pages."
